<section class="modulex-sayac-dev-tek{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-sayac-dev-tek-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</section>

<style>
  /* sayac-dev-tek — Eşit ağırlıklı rakam dizisi yerine hiyerarşi: bir manşet rakam + destekleyen küçük rakamlar (sayac-dev hepsini eşit dev basar). */
  .modulex-sayac-dev-tek { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-sayac-dev-tek *, .modulex-sayac-dev-tek *::before, .modulex-sayac-dev-tek *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-sayac-dev-tek :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-sayac-dev-tek :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-sayac-dev-tek :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-sayac-dev-tek :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-sayac-dev-tek img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-sayac-dev-tek) img { height: auto; }
  .modulex-sayac-dev-tek [hidden] { display: none !important; }
  .modulex-sayac-dev-tek :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-sayac-dev-tek :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-sayac-dev-tek-ic { max-width: --max--; margin-inline: auto; }
  .modulex-sayac-dev-tek-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-sayac-dev-tek--bassiz .modulex-sayac-dev-tek-bas { display: none; }
  .modulex-sayac-dev-tek-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-sayac-dev-tek-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-sayac-dev-tek-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-sayac-dev-tek-bas { max-width: 760px; }
  .modulex-sayac-dev-tek-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-sayac-dev-tek-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-sayac-dev-tek-dugme:hover { transform: translateY(-2px); }
  .modulex-sayac-dev-tek-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-sayac-dev-tek-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-sayac-dev-tek-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-sayac-dev-tek-ana { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: clamp(20px, 4vw, 56px); align-items: end; padding-block-end: clamp(28px, 4vw, 48px); }
  .modulex-sayac-dev-tek-dev { color: --accentInk--; font-size: clamp(5rem, 15vw, 12rem); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.06em; line-height: 0.85; transition: transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.9s ease; }
  .modulex-sayac-dev-tek--hazir:not(.modulex-sayac-dev-tek--gor) .modulex-sayac-dev-tek-dev { opacity: 0; transform: translateY(30px); }
  .modulex-sayac-dev-tek-dev .modulex-sayac-dev-tek-ek { font-size: 0.4em; letter-spacing: 0; }
  .modulex-sayac-dev-tek-ana-yazi { display: grid; gap: 8px; max-width: 420px; padding-block-end: 12px; }
  .modulex-sayac-dev-tek-ikon { color: --accentInk--; font-size: 32px; }
  .modulex-sayac-dev-tek-ana-etiket { font-size: clamp(1.3rem, 2.2vw, 1.7rem); font-weight: 750; line-height: 1.2; }
  .modulex-sayac-dev-tek-not { color: --muted--; }
  .modulex-sayac-dev-tek-diger { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 24px; }
  .modulex-sayac-dev-tek-oge { display: grid; gap: 6px; padding-block-start: 18px; border-block-start: 3px solid --text--; transition: border-color 0.3s ease; }
  .modulex-sayac-dev-tek-oge:hover { border-color: --accent--; }
  .modulex-sayac-dev-tek-sayi { font-size: clamp(1.7rem, 3vw, 2.3rem); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .modulex-sayac-dev-tek-etiket { color: --muted--; font-size: 0.95rem; font-weight: 600; }
  .modulex-sayac-dev-tek-ek { color: --accentInk--; font-size: 0.6em; }
  @media (max-width: 768px) {
    .modulex-sayac-dev-tek-ana { grid-template-columns: minmax(0, 1fr); }
    .modulex-sayac-dev-tek-diger { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-dev-tek :is(.modulex-sayac-dev-tek-baslik, .modulex-sayac-dev-tek-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-dev-tek-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-sayac-dev-tek { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-sayac-dev-tek *, .modulex-sayac-dev-tek *::before, .modulex-sayac-dev-tek *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-sayac-dev-tek";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    const sayac = (s, P, az) => {
        const el = [...s.querySelectorAll("[data-hedef]")];
        if (!el.length || az || !("IntersectionObserver" in window)) return;
        const dl = document.documentElement.lang || undefined;
        const oynat = () => el.forEach((e) => {
          const h = Number(e.dataset.hedef);
          const od = Number(e.dataset.ondalik) || 0;
          const son = e.textContent;
          if (!Number.isFinite(h)) return;
          let f;
          try { f = new Intl.NumberFormat(dl, { minimumFractionDigits: od, maximumFractionDigits: od }); } catch (x) { return; }
          const t0 = performance.now();
          const adim = (t) => {
            const p = Math.min(1, (t - t0) / 1300);
            e.textContent = p < 1 ? f.format(h * (1 - Math.pow(1 - p, 3))) : son;
            if (p < 1) requestAnimationFrame(adim);
          };
          requestAnimationFrame(adim);
        });
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { oynat(); io.disconnect(); } });
        }, { threshold: 0.3 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
      sayac(s, P, az);
    });
  })();
</script>
